<!DOCTYPE html>
<html>
<head>
    <title>Payroll Dispatcher</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        #log { margin-top: 20px; background: #000; color: #00ff00; padding: 15px; height: 350px; overflow-y: auto; font-family: monospace; border-radius: 8px; font-size: 13px; line-height: 1.5; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #1a73e8;">Payroll Dispatcher</h2>
        <input type="file" id="leads" style="margin-bottom: 20px; display: block;">
        <button onclick="start()">Start Dispatch</button>
        <div id="log">> Awaiting your Notepad file...</div>
    </div>

    <script>
        async function start() {
            const file = document.getElementById('leads').files[0];
            if(!file) return alert("Please select a file!");
            const log = document.getElementById('log');
            log.innerHTML = "> Reading Notepad format...<br>";
            
            const data = new FormData();
            data.append('leads_file', file);
            
            const res = await fetch('/send', { method: 'POST', body: data });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            
            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                log.innerHTML += decoder.decode(value);
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
