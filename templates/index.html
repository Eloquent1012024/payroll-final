<!DOCTYPE html>
<html>
<head>
    <title>Payroll Dispatcher</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 550px; }
        h2 { color: #1a73e8; margin-top: 0; }
        .help-text { font-size: 0.9em; color: #666; margin-bottom: 20px; }
        #log { margin-top: 20px; background: #1e1e1e; color: #4af626; padding: 15px; height: 300px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 13px; border-radius: 8px; border: 1px solid #333; line-height: 1.6; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 16px; }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Payroll Dispatcher</h2>
        <p class="help-text">Upload your <b>.txt</b> file. The app will automatically find leads separated by dashed lines.</p>
        
        <input type="file" id="leads" style="margin-bottom: 20px; display: block;">
        
        <button onclick="start()">Launch Real-Time Dispatch</button>
        
        <div id="log">> Ready for file upload...</div>
    </div>

    <script>
        async function start() {
            const file = document.getElementById('leads').files[0];
            if(!file) return alert("Please select your .txt leads file!");
            
            const log = document.getElementById('log');
            log.innerHTML = "> Analyzing data blocks...<br>";
            
            const data = new FormData();
            data.append('leads_file', file);
            
            try {
                const res = await fetch('/send', { method: 'POST', body: data });
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    log.innerHTML += decoder.decode(value);
                    log.scrollTop = log.scrollHeight;
                }
            } catch(e) {
                log.innerHTML += "<br>❌ Connection Lost: " + e;
            }
        }
    </script>
</body>
</html>
