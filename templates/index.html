<!DOCTYPE html>
<html>
<head>
    <title>Payroll Dispatcher</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); width: 550px; }
        #log { margin-top: 20px; background: #121212; color: #00ff41; padding: 20px; height: 350px; overflow-y: auto; font-family: 'Consolas', monospace; border-radius: 8px; line-height: 1.6; }
        button { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #27ae60; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #2c3e50;">Payroll Dispatcher</h2>
        <input type="file" id="fileInput" style="margin-bottom: 20px; display: block;">
        <button onclick="run()">Launch Dispatch</button>
        <div id="log">> Ready for file upload...</div>
    </div>

    <script>
        async function run() {
            const input = document.getElementById('fileInput');
            if(!input.files[0]) return alert("Select file first!");
            
            const log = document.getElementById('log');
            log.innerHTML = "> Initializing Stream...<br>";
            
            const data = new FormData();
            data.append('leads_file', input.files[0]);
            
            const res = await fetch('/send', { method: 'POST', body: data });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            
            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                log.innerHTML += decoder.decode(value);
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
