<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Dispatcher</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #333; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #218838; }
        #log-container { margin-top: 25px; background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 8px; height: 250px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.5; border: 2px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Payroll Dispatcher</h2>
    
    <div class="input-group">
        <label>SMTP Credentials (smtp.txt)</label>
        <input type="file" id="smtpFile">
    </div>

    <div class="input-group">
        <label>Leads List (leads.csv)</label>
        <input type="file" id="leadsFile">
    </div>

    <button onclick="startSending()">Start Real-Time Dispatch</button>

    <div id="log-container">
        > System ready. Awaiting files...
    </div>
</div>

<script>
    async function startSending() {
        const smtpFile = document.getElementById('smtpFile').files[0];
        const leadsFile = document.getElementById('leadsFile').files[0];
        const logContainer = document.getElementById('log-container');

        if (!smtpFile || !leadsFile) {
            alert("Please select both the SMTP and Leads files!");
            return;
        }

        logContainer.innerHTML = "> Connection established...<br>";

        const formData = new FormData();
        formData.append('smtp_file', smtpFile);
        formData.append('leads_file', leadsFile);

        try {
            const response = await fetch('/send', {
                method: 'POST',
                body: formData
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const text = decoder.decode(value);
                logContainer.innerHTML += text;
                logContainer.scrollTop = logContainer.scrollHeight; // Auto-scrolls to bottom
            }
        } catch (error) {
            logContainer.innerHTML += "<br>❌ Connection Error: " + error;
        }
    }
</script>

</body>
</html>
